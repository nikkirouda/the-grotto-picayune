<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Puzzles · The Grotto Picayune</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css">
<style>
  .play-top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top)) 12px 8px; display: flex; align-items: center; gap: 10px; }
  .play-top h1 { font-family: var(--font); font-size: 1.2rem; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .play-top a.back { font-size: 1.3rem; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; }
  .play-top a.back:hover { background: var(--line); }
  .play-main { max-width: 640px; margin: 0 auto; padding: 14px 16px 60px; }
  .hub h2 { font-family: var(--font); font-size: 1.05rem; margin: 22px 0 8px; color: var(--muted); font-weight: 600; }
  .game-card { display: flex; gap: 12px; align-items: center; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .game-card .gi { font-size: 1.6rem; width: 44px; height: 44px; display: grid; place-items: center; background: var(--bg); border-radius: 10px; flex: 0 0 44px; font-family: var(--font); font-weight: 700; }
  .game-card b { font-family: var(--font); font-size: 1.1rem; display: block; }
  .game-card span.d { color: var(--muted); font-size: .88rem; }
  .game-card .done { margin-left: auto; color: var(--like); font-size: .8rem; white-space: nowrap; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 10px 18px; font-size: 1rem; }
  .btn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .4; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
  .msg { min-height: 1.5em; text-align: center; color: var(--muted); font-size: .95rem; margin: 6px 0; }
  .howto { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }

  /* Type Case */
  .tc-word { font-family: var(--font); font-size: 2rem; text-align: center; min-height: 1.4em; letter-spacing: .06em; text-transform: uppercase; border-bottom: 2px solid var(--line); margin: 6px auto 4px; max-width: 420px; word-break: break-all; }
  .tc-word .k { color: var(--gold); }
  .tc-tray { display: grid; grid-template-columns: repeat(3, 76px); gap: 8px; justify-content: center; margin: 16px 0 4px; }
  .tc-tray button { height: 64px; border-radius: 8px; border: 1px solid var(--line); border-bottom-width: 4px; background: var(--bg2); color: var(--ink); font-family: var(--font); font-size: 1.7rem; font-weight: 700; text-transform: uppercase; }
  .tc-tray button.key { background: var(--gold); color: #fff; border-color: var(--gold); grid-column: 1 / -1; }
  .tc-tray button:active { transform: translateY(2px); border-bottom-width: 2px; }
  .meter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .rank { display: flex; justify-content: space-between; gap: 12px; font-size: .9rem; color: var(--muted); } .rank span:last-child { text-align: right; }
  .rank b { color: var(--ink); font-family: var(--font); }
  .found { columns: 3 110px; font-size: .95rem; margin-top: 8px; }
  .found span { display: block; text-transform: capitalize; }
  .found span.full { color: var(--gold); font-weight: 600; }
  .found span.bonus { color: var(--muted); font-style: italic; }
  details.y { margin-top: 22px; color: var(--muted); font-size: .9rem; }

  /* Four Columns */
  .fc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .fc-grid button { min-height: 62px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); font-family: var(--sans); font-weight: 600; font-size: clamp(.6rem, 2.9vw, .9rem); padding: 4px 2px; overflow-wrap: anywhere; }
  .fc-grid button.sel { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .fc-solved { border-left: 5px solid var(--accent); background: var(--bg2); border-radius: 6px; padding: 9px 12px; margin-bottom: 6px; }
  .fc-solved:nth-child(2) { border-color: var(--gold); } .fc-solved:nth-child(3) { border-color: var(--like); } .fc-solved:nth-child(4) { border-color: var(--dislike); }
  .fc-solved b { font-family: var(--font); display: block; } .fc-solved span { font-size: .88rem; color: var(--muted); }
  .fc-solved.missed { opacity: .7; border-style: dashed; }
  .slips { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 10px; letter-spacing: .1em; }

  /* embedded games */
  .embed { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
  .embed iframe { flex: 1; border: 0; width: 100%; background: #fff; }
</style>
</head>
<body>
<header class="play-top">
  <a class="back" id="back" href="../" aria-label="Back">←</a>
  <h1 id="title">Puzzles</h1>
  <a class="small-btn hidden" id="ownTab" target="_blank" rel="noopener noreferrer">open in its own tab ↗</a>
</header>
<main class="play-main" id="main"></main>
<script src="play.js"></script>
</body>
</html>
