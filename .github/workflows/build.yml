name: build
# Gathers the sources when the paper is opened or refreshed on a device holding the owner's token (the page asks
# GitHub to run this), and on every push. There is no clock: nothing runs while nobody is reading.
# The 14-day archive lives in the Actions cache.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt
      - run: pip install -r build/requirements.txt
      - name: Restore the archive from the last run
        uses: actions/cache/restore@v4
        with:
          path: data
          key: store-${{ github.run_id }}
          restore-keys: store-
      - name: Fetch sources and build the bundle
        env:
          NEWS_PASSPHRASE: ${{ secrets.NEWS_PASSPHRASE }}
        run: python3 build/fetch.py
      - name: Save the archive for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: store-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
